name: Build and Release

on:
  push:
    branches:
      - main
      - master
      - 'feature/*'
      - 'hotfix/*'
    paths:
      - '**.go'
  pull_request:
    branches:
      - main
      - master
      - 'feature/*'
      - 'hotfix/*'
    paths:
      - '**.go'

permissions:
  contents: write

jobs:
  build:
    name: Build and Package
    runs-on: ubuntu-latest
    steps:
      - name: Record Start Time
        id: start_time
        run: echo "start_ts=$(date +%s)" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21'
          cache: true

      - name: Configure Go Module Proxy
        run: go env -w GOPROXY=https://goproxy.cn,direct

      - name: Go Mod Tidy
        run: go mod tidy

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

      - name: Run go vet
        run: go vet ./...

      - name: Run go test
        run: go test -v -coverprofile=coverage.out ./...

      - name: Cross-compile for Windows
        id: build
        run: |
          build_start=$(date +%s)

          VERSION=${GITHUB_REF_NAME}
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')

          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -X 'main.Version=${VERSION}' -X 'main.Commit=${COMMIT}' -X 'main.BuildTime=${BUILD_TIME}'" -o bing-bulk-image-downloader.exe main.go

          build_end=$(date +%s)
          echo "build_duration=$((build_end - build_start))" >> $GITHUB_ENV

      - name: Package artifacts
        id: package
        run: |
          pkg_start=$(date +%s)

          # Generate SHA256 checksum
          sha256sum bing-bulk-image-downloader.exe > bing-bulk-image-downloader.exe.sha256

          # Create Zip archive
          zip bing-bulk-image-downloader.zip bing-bulk-image-downloader.exe README.md ReadMe-ZhCn.md bing-bulk-image-downloader.exe.sha256

          pkg_end=$(date +%s)
          echo "pkg_duration=$((pkg_end - pkg_start))" >> $GITHUB_ENV

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bing-bulk-image-downloader-windows-amd64
          path: |
            bing-bulk-image-downloader.exe
            bing-bulk-image-downloader.zip
            bing-bulk-image-downloader.exe.sha256

      - name: Log Execution Time
        if: always()
        run: |
          end_ts=$(date +%s)
          total_duration=$((end_ts - start_ts))
          echo "Total Workflow Duration: ${total_duration} seconds"
          echo "Build Step Duration: ${{ env.build_duration }} seconds"
          echo "Package Step Duration: ${{ env.pkg_duration }} seconds"

      - name: Notify on Failure
        if: failure()
        run: |
          echo "::error::Workflow failed. GitHub will send an email notification to the commit author."

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: bing-bulk-image-downloader-windows-amd64
          path: ./artifacts

      - name: Create Tag
        id: create_tag
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.create_tag.outputs.tag_name }}
          name: Release ${{ steps.create_tag.outputs.tag_name }}
          generate_release_notes: true
          files: |
            ./artifacts/bing-bulk-image-downloader.exe
            ./artifacts/bing-bulk-image-downloader.zip
            ./artifacts/bing-bulk-image-downloader.exe.sha256
